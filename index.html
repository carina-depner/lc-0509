<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Unsere Liebesgeschichte — Luca &amp; Carina, 05.09.2026</title>
<style>
  :root{
    --tinte:#2b2118; --weich:#6b5b4c; --linie:#e6ddd1;
    --papier:#fbf7f1; --karte:#ffffff;
    --gold:#b08d4f; --rose:#c1766b; --sanft:#f4ece1;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--papier); color:var(--tinte);
    font:17px/1.72 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-text-size-adjust:100%;
  }

  /* ---- Kopf ---- */
  header.kopf{
    padding:76px 24px 60px; text-align:center;
    background:
      radial-gradient(120% 90% at 50% 0%, #fff 0%, var(--sanft) 60%, var(--papier) 100%);
    border-bottom:1px solid var(--linie);
  }
  .datum{
    font:600 12px/1 system-ui,sans-serif; letter-spacing:.28em; text-transform:uppercase;
    color:var(--gold); margin-bottom:22px;
  }
  header.kopf h1{
    margin:0; font-weight:400; font-size:clamp(34px,7vw,58px); line-height:1.1;
    letter-spacing:-.01em;
  }
  header.kopf h1 .amp{color:var(--rose); font-style:italic}
  .unter{margin:20px auto 0; max-width:34em; color:var(--weich); font-size:18px}
  .fuer{
    display:inline-block; margin-top:30px; padding:11px 22px;
    background:var(--karte); border:1px solid var(--linie); border-radius:999px;
    font:500 14px/1 system-ui,sans-serif; color:var(--weich);
  }
  .fuer b{color:var(--tinte)}

  /* ---- Eckdaten ---- */
  .eckdaten{
    max-width:960px; margin:-30px auto 0; padding:0 24px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;
  }
  .eck{
    background:var(--karte); border:1px solid var(--linie); border-radius:14px;
    padding:16px 18px; text-align:center;
  }
  .eck .k{font:600 10px/1 system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--gold)}
  .eck .w{margin-top:8px; font-size:19px}
  .eck .z{margin-top:3px; font-size:13px; color:var(--weich)}

  /* ---- Layout ---- */
  .huelle{max-width:1140px; margin:0 auto; padding:56px 24px 96px; display:flex; gap:48px; align-items:flex-start}
  nav.inhalt{
    position:sticky; top:24px; flex:0 0 244px; max-height:calc(100vh - 48px); overflow-y:auto;
  }
  nav.inhalt .titel{
    font:600 11px/1 system-ui,sans-serif; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold); padding:0 10px 12px;
  }
  nav.inhalt ul{list-style:none; margin:0; padding:0}
  nav.inhalt a{
    display:flex; gap:9px; align-items:baseline; padding:7px 10px; border-radius:9px;
    color:var(--weich); text-decoration:none; font:14px/1.35 system-ui,sans-serif;
  }
  nav.inhalt a:hover{background:var(--sanft); color:var(--tinte)}
  nav.inhalt a.hier{background:var(--sanft); color:var(--tinte); font-weight:600}
  nav.inhalt .i{flex:0 0 auto}

  main{flex:1 1 auto; min-width:0}

  /* ---- Kapitel ---- */
  .kapitel{
    background:var(--karte); border:1px solid var(--linie); border-radius:18px;
    padding:34px 38px; margin-bottom:22px; scroll-margin-top:22px;
  }
  .kapitel h2{
    margin:0 0 22px; font-weight:400; font-size:28px; line-height:1.25;
    display:flex; gap:12px; align-items:baseline;
    padding-bottom:16px; border-bottom:1px solid var(--linie);
  }
  .kapitel h2 .kicon{font-size:22px}
  .kapitel h3{margin:34px 0 12px; font-weight:600; font-size:20px; color:var(--tinte)}
  .kapitel h4{margin:26px 0 10px; font-weight:600; font-size:17px; color:var(--weich)}
  .kapitel p{margin:0 0 15px}
  .kapitel ul,.kapitel ol{margin:0 0 16px; padding-left:22px}
  .kapitel li{margin-bottom:9px}
  .kapitel li::marker{color:var(--gold)}
  .kapitel strong{font-weight:600}
  .kapitel a{color:var(--rose)}
  code{
    background:var(--sanft); padding:1px 6px; border-radius:5px;
    font:14px/1 ui-monospace,Menlo,Consolas,monospace;
  }

  blockquote{
    margin:22px 0; padding:18px 24px; border-left:3px solid var(--rose);
    background:linear-gradient(90deg,#fdf8f6,transparent);
    font-style:italic; font-size:19px; color:#4a3a2c;
  }
  blockquote p{margin:0 0 10px}
  blockquote p:last-child{margin:0}
  li blockquote{font-size:17px; margin:12px 0}

  .tabelle{overflow-x:auto; margin:0 0 20px}
  table{border-collapse:collapse; width:100%; font-size:16px}
  th,td{text-align:left; padding:11px 14px; border-bottom:1px solid var(--linie); vertical-align:top}
  th{
    font:600 11px/1.3 system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase;
    color:var(--gold);
  }
  tr:last-child td{border-bottom:none}

  .sensibel{border-color:#e8d3cf; background:#fffcfb}
  .hinweis{
    margin:0 0 20px; padding:11px 15px; border-radius:10px;
    background:#fbeeeb; color:#8d4a3f; font:14px/1.5 system-ui,sans-serif;
  }

  footer{
    border-top:1px solid var(--linie); padding:40px 24px 60px; text-align:center;
    color:var(--weich); font:14px/1.7 system-ui,sans-serif;
  }
  footer .herz{color:var(--rose); font-size:20px; display:block; margin-bottom:12px}

  @media (max-width:900px){
    .huelle{display:block; padding:36px 18px 70px}
    nav.inhalt{
      position:static; width:auto; max-height:none; margin-bottom:26px;
      background:var(--karte); border:1px solid var(--linie); border-radius:16px; padding:18px;
    }
    nav.inhalt ul{
      display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:2px;
    }
    .kapitel{padding:26px 22px; border-radius:16px}
    .kapitel h2{font-size:24px}
    header.kopf{padding:52px 20px 46px}
    .eckdaten{margin-top:-22px; padding:0 18px}
  }
  @media print{
    nav.inhalt{display:none}
    .huelle{display:block; max-width:none; padding:0}
    .kapitel{border:none; padding:0 0 18px; break-inside:auto}
    body{background:#fff}
  }
</style>

<style>
  .schloss{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:28px; text-align:center;
    background:radial-gradient(120% 90% at 50% 0%, #fff 0%, var(--sanft) 55%, var(--papier) 100%);
  }
  .schloss .box{max-width:430px; width:100%}
  .schloss .siegel{font-size:44px; margin-bottom:20px}
  .schloss .datum{
    font:600 12px/1 system-ui,sans-serif; letter-spacing:.28em; text-transform:uppercase;
    color:var(--gold); margin-bottom:16px;
  }
  .schloss h1{margin:0 0 14px; font-weight:400; font-size:clamp(27px,6vw,38px); line-height:1.15}
  .schloss h1 .amp{color:var(--rose); font-style:italic}
  .schloss p{color:var(--weich); margin:0 0 26px; font-size:16px}
  .schloss form{display:flex; gap:9px; flex-wrap:wrap; justify-content:center}
  .schloss input{
    flex:1 1 230px; padding:13px 16px; border:1px solid var(--linie); border-radius:11px;
    background:var(--karte); font:16px/1 system-ui,sans-serif; color:var(--tinte);
  }
  .schloss input:focus{outline:none; border-color:var(--gold)}
  .schloss button{
    padding:13px 24px; border:none; border-radius:11px; cursor:pointer;
    background:var(--tinte); color:#fff; font:600 15px/1 system-ui,sans-serif;
  }
  .schloss button:hover{background:var(--rose)}
  .schloss .fehler{margin-top:18px; color:var(--rose); font:14px/1.5 system-ui,sans-serif; min-height:21px}
</style>
</head>
<body>

<div class="schloss" id="schloss">
  <div class="box">
    <div class="siegel">💌</div>
    <div class="datum">Samstag · 5. September 2026</div>
    <h1>Unsere Liebesgeschichte<br>Luca <span class="amp">&amp;</span> Carina</h1>
    <p>Liebe Theresa, hier ist alles über uns — geschützt, weil viel Persönliches darin steht.
       Das Passwort haben wir dir mit dem Link geschickt.</p>
    <form id="form">
      <input id="pw" type="password" placeholder="Passwort" autocomplete="off" autofocus>
      <button type="submit">Öffnen</button>
    </form>
    <div class="fehler" id="fehler"></div>
  </div>
</div>

  function bytes(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }

  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var fehler = document.getElementById('fehler');
    fehler.textContent = 'Einen Moment …';

    try {
      var roh = bytes(PAKET);
      var salz = roh.slice(0, 16), iv = roh.slice(16, 28), rest = roh.slice(28);

      var basis = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(document.getElementById('pw').value),
        'PBKDF2', false, ['deriveKey']
      );
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salz, iterations: 250000, hash: 'SHA-256' },
        basis, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      // Web Crypto erwartet den Pruefwert hinten, Node liefert ihn vorne.
      var daten = new Uint8Array(rest.length);
      daten.set(rest.slice(16), 0);
      daten.set(rest.slice(0, 16), rest.length - 16);

      var klar = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, daten);
      document.body.innerHTML = new TextDecoder().decode(klar);

      // Die Skripte aus dem entschluesselten Teil laufen nicht von selbst.
      [].slice.call(document.body.querySelectorAll('script')).forEach(function (s) {
        var neu = document.createElement('script');
        neu.textContent = s.textContent;
        document.body.appendChild(neu);
      });
      document.title = 'Unsere Liebesgeschichte — Luca & Carina';
    } catch (err) {
      fehler.textContent = 'Das Passwort stimmt nicht. Magst du es nochmal versuchen?';
    }
  });
})();
